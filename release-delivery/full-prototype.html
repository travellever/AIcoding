function title(name,desc,actions=''){return `<div class="page-title"><div><h1>${name}</h1><p>${desc}</p></div><span class="spacer"></span><div class="actions">${actions}</div></div>`}
function notice(text,green=false){return `<div class="notice ${green?'green':''}">${text}</div>`}
function kpis(items){return `<div class="kpis">${items.map(([l,v,n])=>`<div class="kpi"><span class="label">${l}</span><strong>${v}</strong><small>${n||' '}</small></div>`).join('')}</div>`}
function selectOpts(values,value){return values.map(v=>{const a=Array.isArray(v)?v:[v,v];return `<option value="${esc(a[0])}" ${String(a[0])===String(value)?'selected':''}>${esc(a[1])}</option>`}).join('')}
function searchBox(placeholder='搜索名称或编号'){return `<input class="search" id="search" placeholder="${placeholder}" value="${esc(filters.search||'')}"><button data-action="search">查询</button>`}
function matches(row){return !filters.search||JSON.stringify(row).toLowerCase().includes(filters.search.toLowerCase())}
function headingPanel(name,content){return `<section class="panel"><h2>${name}</h2>${content}</section>`}
function modal(name,body,saveText='保存',saveFn=null){$('#modal-root').innerHTML=`<div class="modal-mask"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(name)}"><div class="modal-head"><h2>${esc(name)}</h2><span class="spacer"></span><button type="button" data-close>✕</button></div><form id="modal-form"><div class="modal-body"><div id="form-error" class="error hidden"></div>${body}</div><div class="modal-foot"><button type="button" data-close>取消</button>${saveFn?`<button class="primary" type="submit">${saveText}</button>`:''}</div></form></div></div>`;$$('[data-close]').forEach(e=>e.onclick=closeModal);$('#modal-form').onsubmit=e=>{e.preventDefault();try{saveFn?.(new FormData(e.target));}catch(err){$('#form-error').textContent=err.message;$('#form-error').classList.remove('hidden')}};$('#modal-root input, #modal-root select, #modal-root textarea')?.focus()}

function num(fd,k,min=0,max=100000,nullable=false){let v=fd.get(k);if(nullable&&String(v).trim()==='')return null;let n=Number(v);if(String(v).trim()===''||!Number.isFinite(n)||n<min||n>max)throw Error(k+'数值应在'+min+'至'+max+'之间');return n}
function integer(fd,k,min=0,max=100000,nullable=false){let n=num(fd,k,min,max,nullable);if(n!==null&&!Number.isInteger(n))throw Error(k+'须为整数');return n}
function text(fd,k){let s=String(fd.get(k)||'').trim();if(!s)throw Error('请填写'+k);return s}
function download(content,name,type='application/json'){const blob=content instanceof Blob?content:new Blob([content],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function dirty(){S.dataVersion++;S.plans.forEach(p=>{if(p.edition===S.edition&&(p.status==='DRAFT'||p.status==='REJECTED'))p.stale=true})}
function capacity(h,z){if(h.available===false)return 0;if(h.outdoor&&z.outdoor!=='是')return 0;if(z.name.includes('室外')&&!h.outdoor)return 0;if(z.name.includes('室内')&&h.outdoor)return 0;if(h.central)return h.capacities[z.central_size]||0;let c=h.capacities[z.size];if(c)return c;if(S.settings.capacityEstimate&&!h.outdoor&&z.size==='3×4')return Math.floor((h.capacities['3×3']||0)*.75);return 0}
function check(p){let hs=Object.fromEntries(p.halls.map(h=>[h.id,h])),zs=Object.fromEntries(p.zones.map(z=>[z.id,z])),totals={},usage={},errors=[];p.zones.forEach(z=>totals[z.id]={brand:0,general:0,halls:[]});for(let a of p.allocations){let h=hs[a.hall],z=zs[a.zone];if(!h||!z){errors.push('存在未知展厅/展区');continue}let c=capacity(h,z);if(!c){errors.push(`${z.name}与${h.id}的空间或规格不兼容`);continue}if(!Number.isInteger(a.brand)||!Number.isInteger(a.general)||a.brand<0||a.general<0){errors.push('展位数量须为非负整数');continue}let u=usage[h.id]??={fraction:0,zones:[]};u.fraction+=(a.brand+a.general)/c;if(!u.zones.includes(z.id))u.zones.push(z.id);totals[z.id].brand+=a.brand;totals[z.id].general+=a.general;totals[z.id].halls.push(h.id)}const max=Number(p.ruleSnapshot?.max_zones||2);for(let [id,u] of Object.entries(usage)){if(u.fraction>1.000001)errors.push(`${id}容量超限（${pct(u.fraction)}）`);if(u.zones.length>max)errors.push(`${id}同厅展区数超过${max}`)}let stats=p.zones.map(z=>{let t=totals[z.id],allocated=t.brand+t.general,total=z.brand==null||z.general==null?null:z.brand+z.general;if(t.brand>(z.brand||0)||t.general>(z.general||0))errors.push(z.name+'分配超过分类需求');return {...t,id:z.id,name:z.name,group:z.group,demand:total,allocated,rate:total?allocated/total:null,shortfall:total==null?null:Math.max(0,Math.ceil(total*(p.ruleSnapshot?.target??1))-allocated)}});let demand=stats.reduce((a,s)=>a+(s.demand||0),0),allocated=stats.reduce((a,s)=>a+s.allocated,0),brand=stats.reduce((a,s)=>a+s.brand,0);return {valid:!errors.length,errors,stats,usage,demand,allocated,brand,general:allocated-brand,rate:demand?allocated/demand:null,missing:stats.filter(s=>s.demand==null).length,netArea:p.allocations.reduce((sum,a)=>{let h=hs[a.hall],z=zs[a.zone];return sum+(a.brand+a.general)*(h?.central?8.84:(z?.size||'3×3').split('×').reduce((a,b)=>a*Number(b),1))},0)}}

function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=ch}if(quoted)throw Error('CSV引号未闭合');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw Error('CSV至少需要表头和一行数据');let headers=rows.shift().map(h=>h.trim().replace(/^\uFEFF/,''));for(let key of ['zoneId','brand','general'])if(!headers.includes(key))throw Error('缺少字段：'+key);return rows.map((r,i)=>({...Object.fromEntries(headers.map((h,j)=>[h,r[j]?.trim()??''])),line:i+2}))}

function simulatePlan(phase,name,strategy='balanced',keepLocks=true){let hs=clone(S.data.halls),zs=clone(S.data.zones.filter(z=>z.phase===phase)),rs=snapshotRules(),alloc=[],base=S.plans.find(p=>p.edition===S.edition&&p.phase===phase&&(p.id===S.selectedPlan))||S.plans.find(p=>p.edition===S.edition&&p.phase===phase);let p={id:uid('PLAN'),name,phase,edition:S.edition,status:'DRAFT',created:now(),allocations:alloc,halls:hs,zones:zs,ruleSnapshot:rs,parent:null,dataVersion:S.dataVersion,note:'浏览器启发式模拟分配；非正式优化服务'};let usage={},remaining=Object.fromEntries(zs.map(z=>[z.id,{brand:z.brand||0,general:z.general||0}]));function put(z,h,b,g,locked=false){let c=capacity(h,z);if(!c)throw Error(z.name+'没有兼容容量');let u=usage[h.id]??={fraction:0,zones:[]};if((b+g)/c+u.fraction>1.000001)throw Error(h.id+'锁定容量超过上限');if(!u.zones.includes(z.id)&&u.zones.length>=rs.max_zones)throw Error(h.id+'锁定混排数超过上限');let a=alloc.find(a=>a.zone===z.id&&a.hall===h.id);if(!a){a={zone:z.id,hall:h.id,brand:0,general:0,locked};alloc.push(a)}a.brand+=b;a.general+=g;a.locked||=locked;u.fraction+=(b+g)/c;if(!u.zones.includes(z.id))u.zones.push(z.id);remaining[z.id].brand-=b;remaining[z.id].general-=g}
 if(keepLocks&&base)for(let a of base.allocations.filter(a=>a.locked)){let z=zs.find(z=>z.id===a.zone),h=hs.find(h=>h.id===a.hall);if(!z||!h)throw Error('锁定项引用已移除的空间或展区');if(remaining[z.id].brand<a.brand||remaining[z.id].general<a.general)throw Error(z.name+'新需求小于锁定数量');put(z,h,a.brand,a.general,true)}
 function score(z,h){let u=usage[h.id],same=u?.zones.includes(z.id),other=alloc.filter(a=>a.zone===z.id),cost=0;let active=rs.rules;for(let r of active){let w=r.weight||0;if(r.field==='custom_ratio'&&((z.custom_ratio||0)>=Number(r.value)||z.volume==='大'||z.weight==='重'))cost+=['A','D'].includes(h.building)?0:w;if(r.field==='crane'&&z.crane==='是'&&!h.outdoor)cost+=w;if(r.field==='fast_setup'&&z.fast_setup==='是'&&!((h.building==='A'&&h.floor===1)||(h.building==='B'&&[1,3].includes(h.floor))||(h.building==='D'&&h.floor===1)))cost+=w;if(r.field==='history'&&!z.history_halls?.includes(h.id))cost+=strategy==='history'?w*4:w;if(r.field==='split'&&other.length){if(!same)cost+=w*(strategy==='compact'?3:1);if(!other.some(a=>hs.find(hh=>hh.id===a.hall)?.floor===h.floor))cost+=w;}if(r.field==='same_sector'){let neighbor=alloc.find(a=>{let zz=zs.find(q=>q.id===a.zone),hh=hs.find(q=>q.id===a.hall);return hh.building===h.building&&(zz.group===z.group||zz.id===z.related)});if(!neighbor)cost+=w}}
 if(h.building==='C'&&(z.volume==='大'||z.weight==='重'))cost+=15;if(same)cost-=40;if(h.central)cost+=5;cost-=(capacity(h,z)||0)/1000;return cost}

function moveAllocation(index,target,b=null,g=null){let p=requireCurrent();if(!p)return;let a=p.allocations[index];if(!a)throw Error('请选择分配段');if(a.locked)throw Error('该分配段已锁定，请先解锁');if(a.hall===target)throw Error('请选择不同展厅');let h0=p.halls.find(h=>h.id===a.hall),h1=p.halls.find(h=>h.id===target);if(!h1)throw Error('目标厅不存在');if(h0.central!==h1.central)throw Error('中央通道与主厅规格不同，禁止静默转换');b=b??a.brand;g=g??a.general;if(!Number.isInteger(b)||!Number.isInteger(g)||b<0||g<0||b>a.brand||g>a.general||b+g<=0)throw Error('移动数量须为正总量且不超过源分类数量');let q=planCopy(p,'移动/拆分'),src=q.allocations[index],dest=q.allocations.find(x=>x.zone===src.zone&&x.hall===target);if(dest?.locked)throw Error('目标同展区分配段已锁定');src.brand-=b;src.general-=g;if(dest){dest.brand+=b;dest.general+=g}else q.allocations.push({zone:src.zone,hall:target,brand:b,general:g,locked:false});q.allocations=q.allocations.filter(x=>x.brand+x.general>0);let c0=check(p),c1=check(q);if(!c1.valid)throw Error(c1.errors.join('；'));if(c0.brand!==c1.brand||c0.general!==c1.general)throw Error('分类计数不守恒');addPlan(q,'移动并生成新版本');toast('调整成功：计数守恒，新版本已保存')}
function lockAllocation(index){let p=requireCurrent(),a=p?.allocations[index];if(!a)throw Error('请选择分配段');let q=planCopy(p,'锁定修改');q.allocations[index].locked=!q.allocations[index].locked;addPlan(q,q.allocations[index].locked?'锁定分配':'解锁分配');toast('锁定状态已保存为新版本')}
function swapForm(){let p=requireCurrent();if(!p)return;let zs=Object.fromEntries(p.zones.map(z=>[z.id,z])),opts=p.allocations.map((a,i)=>[i,zs[a.zone].name+' / '+a.hall+' / '+(a.brand+a.general)]);modal('交换两个分配段',`<p class="muted tiny">整段交换，数量保持不变；两个空间必须相互兼容且交换后容量不超限。</p><div class="form-grid">${selectField('a','第一段',opts,0)}${selectField('b','第二段',opts,1)}</div>`,'交换并校验',fd=>{let i=+fd.get('a'),j=+fd.get('b');if(i===j)throw Error('请选择不同分配段');let q=planCopy(p,'交换'),a=q.allocations[i],b=q.allocations[j];if(a.locked||b.locked)throw Error('先解除锁定');if(a.hall===b.hall)throw Error('两个分配段已在同厅');let h0=q.halls.find(h=>h.id===a.hall),h1=q.halls.find(h=>h.id===b.hall);if(h0.central!==h1.central)throw Error('主厅与通道不能静默转换规格');[a.hall,b.hall]=[b.hall,a.hall];let merged={};q.allocations.forEach(a=>{let k=a.zone+'|'+a.hall;if(merged[k]){merged[k].brand+=a.brand;merged[k].general+=a.general}else merged[k]=a});q.allocations=Object.values(merged);addPlan(q,'交换分配段');closeModal();toast('交换成功')})}
function repairForm(){let p=requireCurrent();if(!p)return;modal('锁定后局部重排（浏览器模拟）',`<p>已锁定的分配段将保持不动，重新分配未锁定需求。</p><div class="risk">当前模拟器使用“锁定段固定 + 未锁定部分重排”，不具备正式后端的最小迁移最优保证。</div>${field('name','重排方案名称',p.name+' · 局部重排','text','required')}`,'预览重排结果',fd=>{let q=simulatePlan(S.phase,text(fd,'name'),'compact',true);q.parent=p.id;let old=Object.fromEntries(p.allocations.map(a=>[a.zone+'|'+a.hall,a.brand+a.general])),changed=q.allocations.filter(a=>(old[a.zone+'|'+a.hall]||0)!==a.brand+a.general).length;modal('重排预览',`<p>原方案不变，确认后保存新的子版本。</p>${kpis([['原分配',fmt(check(p).allocated)],['新分配',fmt(check(q).allocated)],['变化分配段',changed],['保留锁定',q.allocations.filter(a=>a.locked).length]])}<div class="notice">容量和兼容校验通过；仍需真实安全校验。</div>`,'应用新版本',()=>{addPlan(q,'应用锁定后重排');closeModal();toast('已应用重排草案')})})}
function copyPlan(id){let p=S.plans.find(p=>p.id===id)||requireCurrent();if(!p)return;let q={...clone(p),id:uid('PLAN'),name:p.name+' · 复制草案',parent:p.id,status:'DRAFT',created:now()};S.plans.unshift(q);S.selectedPlan=q.id;S.phase=q.phase;log('方案管理','复制为可编辑草案',q.id);render();toast('已复制，原审核/发布版本保持冻结')}
function description(p){let c=check(p);return `<h1>第${p.edition}届 ${phaseName(p.phase)} · 方案设计说明</h1><p>方案：${esc(p.name)} / ${esc(p.id)}；创建时间：${time(p.created)}</p><p>状态：${STATUS[p.status]?.[0]||p.status}。本文由确定性统计生成，不调用外部AI。</p><h2>需求与分配</h2><p>已知需求${fmt(c.demand)}，分配${fmt(c.allocated)}；品牌${fmt(c.brand)}、一般${fmt(c.general)}；满足率${pct(c.rate)}；净展位面积${fmt(Math.round(c.netArea))}m²。${c.missing}条需求缺失。</p><h2>设计原则</h2><p>优先品牌、控制空间容量与规格兼容、考虑展馆物流偏好；目标满足率允许未达标。已锁定分配段${p.allocations.filter(a=>a.locked).length}条。</p><h2>执行状态</h2><p>${esc(p.note||'参考资料演示方案')}。浏览器模拟不保证全局最优，历史布局不构成安全依据。</p><h2>待确认条件</h2><ul><li>批准容量模板与中央通道独立容量</li><li>实际底图、消防、设施与数值荷载</li><li>缺失展区需求及组织归属明细</li></ul><p><b>本说明与布局均为演示草案，不可直接发布或施工。</b></p>${table(['展区','需求','分配','品牌','一般','满足率'],c.stats.map(s=>[esc(s.name),fmt(s.demand),fmt(s.allocated),s.brand,s.general,pct(s.rate)]))}`}
function reviewDetail(id){let p=S.plans.find(p=>p.id===id),c=check(p);modal('审核校验单 · '+p.name,`<p>${status(p.status)} · ${esc(p.id)}</p>${table(['检查项','结果','说明'],[['容量与整数分配',badge(c.valid?'通过':'失败',c.valid?'green':'red'),esc(c.errors.join('；')||'按示例资源模型校验')],['展位目标',badge('软目标','blue'),pct(c.rate)+'；不足不构成硬冲突'],['需求数据',badge(c.missing?'有缺失':'已知需求齐全',c.missing?'amber':'green'),c.missing+'条需求缺失'],['消防与实际几何',badge('UNKNOWN','amber'),'底图、通道及专业阈值未提供'],['荷载与设施',badge('UNKNOWN','amber'),'缺少数值展品负荷与同时使用参数'],['正式发布',badge('禁止','red'),'仅允许流转演示状态']])}`,'',null)}
function submitPlan(id){let p=S.plans.find(p=>p.id===id)||requireCurrent();if(!p)return;if(!['DRAFT','REJECTED'].includes(p.status))throw Error('只有草案/退回方案可提交');if(!check(p).valid)throw Error('存在模型冲突，不能提交');modal('提交演示审核',`<p>将冻结当前版本，后续修改需复制新草案。</p><div class="notice">真实安全信息尚未齐备，此操作只提交本机演示审核，不会发送给任何人。</div>${field('comment','提交说明','请评审演示布局与缺口','text','required')}`,'提交演示审核',fd=>{p.status='SUBMITTED';S.reviews.unshift({time:now(),planId:p.id,actor:S.role,action:'提交演示审核',comment:text(fd,'comment')});log('审批流','提交演示审核',p.id);closeModal();render();toast('已提交，切换审核发布员可继续流转')})}
function reviewPlan(id){if(S.role!=='reviewer')throw Error('请在顶部将演示角色切换为“审核发布员”');let p=S.plans.find(p=>p.id===id);if(p.status!=='SUBMITTED')throw Error('方案未处于待审状态');modal('演示审核 · '+p.name,`<div class="notice">通过仅表示演示流程完成；真实安全为UNKNOWN，不能正式发布。</div>${selectField('decision','演示审核意见',[['approve','演示通过'],['reject','退回修改']],'approve')}${field('comment','审核说明','已查看容量与需求，安全资料仍待补齐','text','required')}`,'确认演示意见',fd=>{p.status=fd.get('decision')==='approve'?'DEMO_APPROVED':'REJECTED';S.reviews.unshift({time:now(),planId:id,actor:S.role,action:fd.get('decision')==='approve'?'演示审核通过':'演示退回',comment:text(fd,'comment')});log('审批流','保存演示审核意见',id);closeModal();render();toast('演示意见已保存')})}
function publishPlan(id){if(S.role!=='reviewer')throw Error('请切换为审核发布员');let p=S.plans.find(p=>p.id===id);if(p.status!=='DEMO_APPROVED')throw Error('请先完成演示审核');modal('演示发布确认',`<div class="risk"><b>正式发布条件未满足</b><br>消防、底图与批准容量仍为UNKNOWN。本操作仅将浏览器内状态标为“演示已发布”，不对外发布。</div><label class="check"><input name="ack" type="checkbox" required>我理解这不是正式业务发布</label>`,'确认演示发布',fd=>{if(!fd.has('ack'))throw Error('请确认演示性质');p.status='DEMO_PUBLISHED';S.reviews.unshift({time:now(),planId:id,actor:S.role,action:'演示发布',comment:'仅本地流程，正式发布被安全缺口阻止'});log('审批流','演示发布冻结版本',id);closeModal();render();toast('已完成演示发布；原始快照冻结')})}
function csv(rows){return '\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n')}
function recordExport(name,type,pid){S.exports.unshift({name,type,planId:pid||'工作区',created:now()});log('出图与导出','浏览器发起文件下载',name)}
function svgContent(p){let doc=new DOMParser().parseFromString(renderMap(p).replace(/^<div class="map-wrap">/,'').replace(/<\/div>$/,''),'image/svg+xml');let svg=doc.documentElement;svg.setAttribute('width','1300');svg.setAttribute('height','1020');return new XMLSerializer().serializeToString(svg)}
function exportSVG(){let p=requireCurrent();if(!p)return;let name='layout-'+p.edition+'-'+p.phase+'-DEMO.svg';download(svgContent(p),name,'image/svg+xml');recordExport(name,'SVG',p.id);toast('已发起SVG下载')}
function exportPNG(){let p=requireCurrent();if(!p)return;let img=new Image(),url=URL.createObjectURL(new Blob([svgContent(p)],{type:'image/svg+xml'}));img.onload=()=>{let canvas=document.createElement('canvas');canvas.width=1950;canvas.height=1530;let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,1950,1530);canvas.toBlob(blob=>{if(blob){let name='layout-'+p.edition+'-'+p.phase+'-DEMO.png';download(blob,name,'image/png');recordExport(name,'PNG',p.id);toast('已生成PNG并发起下载')}else toast('PNG生成失败')},'image/png');URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);toast('SVG渲染失败，仍可直接导出SVG')};img.src=url}
function statsCSV(){let p=requireCurrent();if(!p)return;let c=check(p),name='statistics-'+p.phase+'.csv';download(csv([['展区','需求','品牌','一般','分配','满足率','目标缺口','展厅'],...c.stats.map(s=>[s.name,s.demand,s.brand,s.general,s.allocated,s.rate,s.shortfall,s.halls.join(';')])]),name,'text/csv;charset=utf-8');recordExport(name,'CSV',p.id);toast('分区统计CSV已发起下载')}

function printPlan(){let p=requireCurrent();if(!p)return;let win=window.open('','_blank');if(!win)return toast('浏览器阻止弹出窗口，请允许后重试');win.document.write(`<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>布局草案打印</title><style>body{font:13px/1.7 system-ui;padding:25px;color:#253c2d}svg{width:100%;height:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:7px}h1{font-size:22px}button{padding:10px 20px}@media print{button{display:none}.map-wrap{break-after:page}}</style></head><body><button onclick="window.print()">打印 / 另存为PDF</button>${renderMap(p)}${description(p)}</body></html>`);win.document.close();recordExport('layout-'+p.phase+'-print.html','打印 / PDF',p.id);toast('打印页面已打开，请点击打印并选择另存为PDF')}

 'pull-sync':()=>{if(!S.sync.enabled)throw Error('模拟连接器未启用');if(S.sync.pending.length)throw Error('请先应用或处理已有待同步变更');let z=phaseZones().find(z=>z.total>0);if(!z)throw Error('本期无有效需求');S.sync.pending=[{zoneId:z.id,brand:z.brand,general:z.general+12,sourceVersion:uid('SRC'),phase:S.phase,edition:S.edition}];log('需求同步','模拟拉取一条增量','仅本地构造变更');render();toast('已生成模拟差异，确认前不修改需求')},

 'save-sync':()=>{let interval=Number($('#sync-interval').value);if(!Number.isInteger(interval)||interval<1||interval>1440)throw Error('间隔须为1至1440整数');S.sync.mode=$('#sync-mode').value;S.sync.interval=interval;S.sync.enabled=$('#sync-enabled').checked;log('需求同步','保存模拟连接器配置','不启动后台任务');toast('模拟配置已保存，不会连接生产系统')},
 'submit-plan':e=>submitPlan(e.dataset.id),'review-detail':e=>reviewDetail(e.dataset.id),'review-plan':e=>reviewPlan(e.dataset.id),'publish-plan':e=>publishPlan(e.dataset.id),
 'export-svg':exportSVG,'export-png':exportPNG,'export-print':printPlan,
 'export-plan-json':()=>{let p=requireCurrent();if(!p)return;let name=p.id+'.json';download(JSON.stringify({...p,validation:check(p)},null,2),name);recordExport(name,'JSON',p.id);toast('方案快照JSON已下载')},
 'export-description':()=>{let p=requireCurrent();if(!p)return;let name='description-'+p.phase+'.html';download('<!doctype html><html lang="zh"><meta charset="utf-8"><title>方案说明</title><style>body{font:14px/1.8 system-ui;max-width:1000px;margin:40px auto;color:#274337}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:8px}</style>'+description(p)+'</html>',name,'text/html;charset=utf-8');recordExport(name,'HTML',p.id);toast('方案说明HTML已下载')},
 'export-workspace':()=>{download(JSON.stringify({kind:'exhibition-demo-workspace',version:2,state:S},null,2),'exhibition-workspace.json');log('工作区','导出演示工作区备份');toast('本机工作区备份已下载')},
 'audit-csv':()=>{download(csv([['时间','操作者','模块','操作','详情'],...S.audit.map(a=>[time(a.time),a.actor,a.module,a.action,a.detail])]),'audit-log.csv','text/csv;charset=utf-8');toast('审计CSV已下载')},
 'save-settings':()=>{let value=$('#estimate-setting').checked;if(value!==S.settings.capacityEstimate){S.settings.capacityEstimate=value;dirty()}log('设置','保存容量估算模式',value?'允许估算':'严格规格');toast('设置已保存，已有草案可能需要刷新')},
 'reset-demo':()=>modal('重置演示工作区',`<p>此操作只会清除当前浏览器的演示修改，恢复初始参考数据。建议先导出工作区JSON。</p>`,'确认重置',()=>{S=initial();persist();closeModal();render();toast('已恢复初始演示数据')})
};
function bindActions(){const actionEls=$$('[data-action]');for(let el of actionEls)el.onclick=async ev=>{if(el.disabled)return;ev.preventDefault();let action=actions[el.dataset.action];if(!action)return toast('该动作尚未配置');try{await action(el)}catch(e){toast(e.message)}}}
function bindPage(){bindActions();let search=$('#search');if(search)search.onkeydown=e=>{if(e.key==='Enter')actions.search()};for(let [selector,key] of [['#building-filter','building'],['#rule-type','type'],['#stat-dimension','dimension'],['#compare-mode','compareMode'],['#compare-plan','comparePlan']]){let el=$(selector);if(el)el.onchange=()=>{filters[key]=el.value;render()}}if($('#only-phase'))$('#only-phase').onchange=e=>{filters.onlyPhase=e.target.checked;render()};if($('#geometry-hall'))$('#geometry-hall').onchange=e=>{filters.hall=e.target.value;render()};if($('#editor-plan'))$('#editor-plan').onchange=e=>{S.selectedPlan=e.target.value;persist();render()};if($('#csv-upload'))$('#csv-upload').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>2e6)throw Error('CSV请小于2MB');previewImport(f.name,parseCSV(await f.text()))}catch(err){toast(err.message)}};
 if($('#workspace-upload'))$('#workspace-upload').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>10e6)throw Error('工作区JSON请小于10MB');let value=JSON.parse(await f.text()),v=value.state;if(value.kind!=='exhibition-demo-workspace'||value.version!==2||!v?.data?.halls?.length||!Array.isArray(v.data.zones)||!Array.isArray(v.plans)||!Array.isArray(v.rules)||!Array.isArray(v.audit))throw Error('不是本原型导出的有效工作区文件');modal('确认恢复工作区',`<p>将用该文件替换当前浏览器的演示数据：${v.plans.length}个方案、${v.rules.length}条规则。</p>`,'确认替换',()=>{S=v;S.page='overview';log('工作区','从备份恢复演示状态',f.name);closeModal();render();toast('恢复完成')})}catch(err){toast('恢复失败：'+err.message)}};
 $$('.hall-hit').forEach(el=>el.addEventListener('click',e=>{if(S.page==='geometry'){filters.hall=el.dataset.hall;render()}}));
 if(S.page==='editor'){$$('.allocation').forEach(el=>el.addEventListener('pointerdown',ev=>{let p=current(),a=p.allocations.find(a=>a.zone===el.dataset.zone&&a.hall===el.dataset.from);if(!a||ev.button!==0)return;drag={index:p.allocations.indexOf(a),from:a.hall,x:ev.clientX,y:ev.clientY,moved:false};let ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=(p.zones.find(z=>z.id===a.zone)?.name||a.zone)+' / '+(a.brand+a.general);ghost.id='drag-ghost';ghost.style.left=ev.clientX+12+'px';ghost.style.top=ev.clientY+12+'px';document.body.appendChild(ghost);ev.preventDefault()}))}
}
document.addEventListener('pointermove',ev=>{if(!drag)return;drag.moved||=Math.abs(ev.clientX-drag.x)+Math.abs(ev.clientY-drag.y)>5;let ghost=$('#drag-ghost');if(ghost){ghost.style.left=ev.clientX+12+'px';ghost.style.top=ev.clientY+12+'px'}});
document.addEventListener('pointerup',ev=>{if(!drag)return;let d=drag;drag=null;$('#drag-ghost')?.remove();let target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.hall-hit');if(!d.moved){if($('#edit-allocation'))$('#edit-allocation').value=String(d.index);return}if(target&&target.dataset.hall!==d.from)try{moveAllocation(d.index,target.dataset.hall)}catch(e){toast('移动未应用：'+e.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();drag=null;$('#drag-ghost')?.remove()}});
const renderers={overview,editions,halls,geometry,zones,demands,imports,rules:rulesPage,generate:generatePage,plans:plansPage,editor,compare,statistics,sync:syncPage,approvals,exports:exportsPage,audit:auditPage,settings,help};
function render(){if(!renderers[S.page])S.page='overview';try{if(location.hash!=='#'+S.page)history.replaceState(null,'','#'+S.page)}catch{};$('#navigation').innerHTML=pages.map(([group,id,icon,name])=>`${group?`<div class="nav-group">${group}</div>`:''}<button class="nav-item ${S.page===id?'current':''}" data-action="nav" data-page="${id}"><span class="nav-icon">${icon}</span>${name}${id==='approvals'&&S.plans.some(p=>p.status==='SUBMITTED')?'<span class="tag-number">●</span>':''}</button>`).join('');$('#breadcrumb').textContent=pages.find(p=>p[1]===S.page)?.[3]||'';$('#edition-select').innerHTML=selectOpts(S.editions.map(e=>[e.id,e.name]),S.edition);$('#phase-select').value=S.phase;$('#role-select').value=S.role;$('#content').innerHTML=renderers[S.page]()+`<footer><span>展序 · 完整交互原型 v2.0 ｜ 浏览器离线运行 ｜ ${pages.length}个功能页面</span><span id="storage-state">本机演示数据 · 不连接生产系统</span></footer>`;bindPage();$('#edition-select').onchange=e=>switchEdition(+e.target.value);$('#phase-select').onchange=e=>setPhase(+e.target.value);$('#role-select').onchange=e=>{S.role=e.target.value;persist();render();toast('已切换演示角色')};document.title=pages.find(p=>p[1]===S.page)?.[3]+' · 展序全流程原型'}
window.ExhibitionDemo={getState:()=>clone(S),check:()=>current()?check(current()):null,go,reset:()=>{S=initial();persist();render()}};
if(renderers[location.hash.slice(1)])S.page=location.hash.slice(1);
window.addEventListener('hashchange',()=>{let page=location.hash.slice(1);if(renderers[page]&&S.page!==page)go(page)});
render();persist();
</script></body></html>
